<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1024">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To do">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>To do</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>✅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Dark theme only, so the phone's top bar always matches the page */
:root {
  color-scheme: dark;
  --bg: linear-gradient(160deg, #0f1024 0%, #1a1240 50%, #0b2430 100%);
  --ink: #eceaff;
  --muted: #a3a6cf;
  --line: rgba(255, 255, 255, 0.1);
  --card: rgba(255, 255, 255, 0.06);
  --card-strong: rgba(30, 28, 60, 0.8);
  --accent: #9d8cff;
  --accent-2: #2dd4bf;
  --accent-ink: #0f0d24;
  --danger: #fb7185;
  --star: #fbbf24;
}
html { background: #0f1024; } /* shown if the page is pulled past its end */
html, body { touch-action: manipulation; } /* no double-tap zoom */
* { box-sizing: border-box; }
body {
  position: relative;
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: transparent;
  color: var(--ink);
  font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
  font-size: 16px;
  overflow-x: hidden;
}

/* Animated background: soft colour orbs that drift slowly */
.bg { position: absolute; top: -40vh; left: 0; right: 0; bottom: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--bg); }
.bg span {
  position: absolute; border-radius: 50%; filter: blur(70px);
  opacity: 0.3; animation: drift 26s ease-in-out infinite alternate;
}
.bg span:nth-child(1) { width: 52vmax; height: 52vmax; top: -18vmax; left: -14vmax; background: #a5b4fc; }
.bg span:nth-child(2) { width: 48vmax; height: 48vmax; bottom: -18vmax; right: -14vmax; background: #5eead4; animation-duration: 32s; animation-delay: -9s; }
.bg span:nth-child(3) { width: 36vmax; height: 36vmax; top: 35%; left: 35%; background: #f9a8d4; opacity: 0.4; animation-duration: 30s; animation-delay: -15s; }
@keyframes drift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(7vmax, -5vmax, 0) scale(1.12); }
}

main { position: relative; max-width: 640px; margin: 0 auto; padding: calc(36px + env(safe-area-inset-top, 0px)) 16px 110px; }

h1 {
  display: inline-block; font-size: 2.2rem; font-weight: 700; letter-spacing: -0.03em;
  margin: 0 0 6px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
  background-size: 200% auto;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: shimmer 8s linear infinite;
}
@keyframes shimmer { to { background-position: 200% center; } }

.sub { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 22px; }
.sub span {
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 12px; font-size: 0.85rem; color: var(--muted);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
#sync:empty { display: none; }

h2 {
  font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted); margin: 30px 4px 10px; padding: 0; border: none;
}

button, input { font: inherit; color: var(--ink); }
button {
  border: 1px solid var(--line); background: var(--card-strong); border-radius: 999px;
  padding: 9px 16px; cursor: pointer; white-space: nowrap;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s, filter 0.2s;
}
button:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(91, 91, 214, 0.18); }
button:active { transform: scale(0.97); }
button.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent; color: var(--accent-ink); font-weight: 600;
  box-shadow: 0 6px 18px rgba(91, 91, 214, 0.3);
}
button.primary:hover { filter: brightness(1.06); }
button:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
button:disabled:hover { border-color: var(--line); box-shadow: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

input[type="text"], input[type="number"], .edit {
  border: 1px solid var(--line); background: var(--card-strong); border-radius: 14px;
  padding: 12px 16px; min-width: 0; font-size: 16px; outline: none;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  transition: border-color 0.2s, box-shadow 0.2s;
}
input[type="text"]:focus, input[type="number"]:focus, .edit:focus {
  border-color: var(--accent); box-shadow: 0 0 0 4px rgba(91, 91, 214, 0.15);
}
input[type="text"] { flex: 1; }
input[type="number"] { width: 72px; }

.add { display: flex; gap: 10px; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 16px 0 10px; }
#status { color: var(--muted); font-size: 0.85rem; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item {
  position: relative; display: flex; align-items: center; gap: 12px;
  padding: 12px 12px 12px 6px;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 2px 10px rgba(40, 40, 100, 0.06);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: box-shadow 0.2s, background 0.2s;
}
.item:hover { box-shadow: 0 6px 18px rgba(40, 40, 100, 0.1); }
.item.done { opacity: 0.6; }
.item.priority {
  border-color: rgba(245, 158, 11, 0.45);
  background: linear-gradient(90deg, rgba(251, 191, 36, 0.2), var(--card) 60%);
}
.item.priority .text { font-weight: 600; }
.item.picked {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(91, 91, 214, 0.2), 0 8px 24px rgba(91, 91, 214, 0.2);
}
.item.dragging {
  z-index: 2; transition: none;
  box-shadow: 0 14px 30px rgba(40, 40, 100, 0.22);
}
.item.shift { transition: transform 0.2s ease; }
.item.drop-above::before, .item.drop-below::after {
  content: ""; position: absolute; left: 12px; right: 12px; height: 3px;
  border-radius: 3px; background: var(--accent);
}
.item.drop-above::before { top: -7px; }
.item.drop-below::after { bottom: -7px; }

.handle {
  flex: none; padding: 6px 4px; font-size: 1.2rem; line-height: 1; color: var(--muted);
  opacity: 0.6; cursor: grab; touch-action: none; user-select: none;
  -webkit-user-select: none; -webkit-touch-callout: none;
}

.item input[type="checkbox"] {
  -webkit-appearance: none; appearance: none; flex: none;
  width: 24px; height: 24px; margin: 0; cursor: pointer;
  border: 2px solid var(--accent); border-radius: 50%; background: transparent;
  display: grid; place-content: center;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
}
.item input[type="checkbox"]::before {
  content: ""; width: 6px; height: 12px;
  border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0;
  transform: translateY(-1px) rotate(45deg) scale(0);
  transition: transform 0.25s cubic-bezier(0.3, 1.6, 0.6, 1);
}
.item input[type="checkbox"]:checked {
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent;
}
.item input[type="checkbox"]:checked::before { transform: translateY(-1px) rotate(45deg) scale(1); }
.item input[type="checkbox"]:active { transform: scale(0.88); }

.text {
  flex: 1; min-width: 0; overflow-wrap: anywhere; padding: 2px 0;
  cursor: text; border-radius: 6px; line-height: 1.35;
}
.item.done .text { color: var(--muted); text-decoration: line-through; }
.edit { flex: 1; }

.star {
  flex: none; padding: 2px 4px; font-size: 1.25rem; line-height: 1;
  border: none; background: none; box-shadow: none; color: var(--muted);
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.star:hover { box-shadow: none; transform: scale(1.15); }
.star[aria-pressed="true"] { color: var(--star); text-shadow: 0 0 12px rgba(245, 158, 11, 0.6); }

.del {
  flex: none; padding: 2px 8px; font-size: 1.4rem; line-height: 1; color: var(--muted);
  border: none; background: none; box-shadow: none; border-radius: 999px;
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.del:hover { color: var(--danger); background: rgba(220, 38, 38, 0.08); box-shadow: none; transform: none; border: none; }

.empty {
  text-align: center; color: var(--muted); padding: 24px 16px;
  border: 1px dashed var(--line); border-radius: 16px; background: transparent;
}

@media (prefers-reduced-motion: reduce) {
  .bg span, h1 { animation: none; }
  * { transition: none !important; }
}

/* Bottom tab bar */
/* Floats on the page background: a soft fade instead of a solid strip, so there is no seam or gap */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; gap: 8px; padding: 10px 16px 8px;
  background: linear-gradient(to bottom, rgba(10, 12, 28, 0), rgba(10, 12, 28, 0.55));
}
/* Installed home-screen app: keep clear of the iPhone home indicator */
@media (display-mode: standalone) {
  .tabs { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
}

.tab { flex: 1; min-height: 42px; padding: 10px 14px; font-weight: 600; }
.tab[aria-pressed="true"] {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent; color: var(--accent-ink);
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><span></span><span></span><span></span></div>
<section id="view-todo" hidden>
<main>
  <h1>To do</h1>
  <div class="sub"><span id="count"></span><span id="sync"></span></div>

  <form id="add-form" class="add" autocomplete="off">
    <input id="new" type="text" placeholder="Add a to-do" aria-label="New to-do" maxlength="500">
    <button class="primary" type="submit">Add</button>
  </form>

  <div class="toolbar">
    <input id="pick-count" type="number" min="1" value="1" aria-label="How many to pick">
    <button id="undo" type="button" title="Undo (Ctrl/⌘+Z)" disabled>Undo</button>
    <button id="redo" type="button" title="Redo (Ctrl/⌘+Shift+Z)" disabled>Redo</button>
    <button id="pick" type="button">Pick random</button>
    <button id="clear-pick" type="button" hidden>Clear pick</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>

  <ul id="list" class="list" aria-label="Open to-dos"></ul>

  <h2 id="done-head" hidden><span id="done-title"></span></h2>
  <ul id="done" class="list" aria-label="Done to-dos"></ul>
</main>
</section>

<section id="view-random">
  <div id="random-host"></div>
</section>

<template id="random-template">
<style>
:host {
  display: block; position: relative; color: var(--ink);
  font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --bg: linear-gradient(160deg, #0f1024 0%, #1a1240 50%, #0b2430 100%);
  --ink: #eceaff; --muted: #a3a6cf;
  --line: rgba(255, 255, 255, 0.1);
  --card: rgba(255, 255, 255, 0.06);
  --card-strong: rgba(30, 28, 60, 0.8);
  --accent: #9d8cff; --accent-2: #2dd4bf; --accent-ink: #0f0d24;
  --err: #fb7185;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

/* Same animated background as the To do screen */
.bg { position: absolute; top: -40vh; left: 0; right: 0; bottom: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--bg); }
.bg i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.3; animation: drift 26s ease-in-out infinite alternate; }
.bg i:nth-child(1) { width: 52vmax; height: 52vmax; top: -18vmax; left: -14vmax; background: #a5b4fc; }
.bg i:nth-child(2) { width: 48vmax; height: 48vmax; bottom: -18vmax; right: -14vmax; background: #5eead4; animation-duration: 32s; animation-delay: -9s; }
.bg i:nth-child(3) { width: 36vmax; height: 36vmax; top: 35%; left: 35%; background: #f9a8d4; opacity: 0.2; animation-duration: 30s; animation-delay: -15s; }
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(7vmax, -5vmax, 0) scale(1.12); } }

.app {
  position: relative; max-width: 640px; margin: 0 auto;
  padding: calc(36px + env(safe-area-inset-top, 0px)) 16px calc(96px + env(safe-area-inset-bottom, 0px));
}

.hero { display: flex; align-items: center; gap: 14px; margin: 0 0 22px; animation: rise 0.6s both; }
.die { width: 44px; height: 44px; flex: none; color: var(--accent); filter: drop-shadow(0 6px 12px rgba(157, 140, 255, 0.35)); animation: bob 3.2s ease-in-out infinite; }
.die.roll { animation: tumble 0.7s cubic-bezier(0.3, 1.4, 0.5, 1); }
@keyframes bob { 50% { transform: translateY(-4px) rotate(-4deg); } }
@keyframes tumble { 0% { transform: rotate(0) scale(1); } 40% { transform: rotate(200deg) scale(1.25); } 100% { transform: rotate(360deg) scale(1); } }
h1 {
  display: inline-block; margin: 0; font-size: 2.2rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1;
  background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent)); background-size: 200% auto;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: shimmer 8s linear infinite;
}
@keyframes shimmer { to { background-position: 200% center; } }
.sub {
  display: inline-block; margin-top: 8px; padding: 4px 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  font-size: 0.85rem; color: var(--muted);
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.result {
  position: relative; min-height: 176px; padding: 22px;
  display: flex; flex-direction: column; justify-content: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  animation: rise 0.6s 0.08s both;
}
.result.flash { animation: flash 0.6s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(157, 140, 255, 0.55); } 100% { box-shadow: 0 0 0 22px rgba(157, 140, 255, 0); } }
.result .nums {
  display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center;
  font-variant-numeric: tabular-nums; font-weight: 800; line-height: 1.1; word-break: break-all;
  color: var(--ink); text-shadow: 0 0 24px rgba(157, 140, 255, 0.35);
}
.result .nums.one { font-size: 4.2rem; }
.result .nums.few { font-size: 2.4rem; }
.result .nums.many { font-size: 1.5rem; font-weight: 700; }
.result .nums span { display: inline-block; }
.result .nums.final span { animation: pop 0.28s cubic-bezier(0.2, 1.4, 0.4, 1) both; animation-delay: calc(var(--i, 0) * 12ms); }
.result .nums.rolling { opacity: 0.7; filter: blur(0.6px); }
@keyframes pop { 0% { opacity: 0; transform: translateY(18px) scale(0.6); } 100% { opacity: 1; transform: none; } }
.result .hint { color: var(--muted); text-align: center; font-size: 1.05rem; animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.55; } }
.result .error { color: var(--err); text-align: center; font-size: 1rem; font-weight: 600; animation: shake 0.4s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.actions { display: flex; gap: 10px; margin: 14px 0 22px; animation: rise 0.6s 0.16s both; }
button {
  font: inherit; color: var(--ink); min-height: 52px; padding: 0 18px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card-strong); border-radius: 999px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
}
button:hover { border-color: var(--accent); }
button:active { transform: scale(0.97); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#gen {
  position: relative; overflow: hidden; flex: 1;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent; color: var(--accent-ink); font-size: 1.1rem; font-weight: 600;
  box-shadow: 0 6px 18px rgba(157, 140, 255, 0.3);
}
#gen::after {
  content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; transform: skewX(-20deg);
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
  animation: shine 3.4s ease-in-out infinite;
}
@keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
#copy { font-weight: 600; padding: 0 22px; }

.settings {
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 4px 16px;
  box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  animation: rise 0.6s 0.24s both;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row > label, .row .lbl { font-size: 1.05rem; }
.row small { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
input[type="number"] {
  width: 130px; font: inherit; font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right;
  padding: 10px 14px; min-width: 0; color: var(--ink); outline: none;
  border: 1px solid var(--line); border-radius: 14px; background: var(--card-strong);
  transition: border-color 0.2s, box-shadow 0.2s;
}
input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(157, 140, 255, 0.2); }
.switch { display: block; position: relative; width: 54px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 32px; transition: background 0.25s; }
.switch span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); transition: transform 0.3s cubic-bezier(0.3, 1.5, 0.5, 1);
}
.switch input:checked + span { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.switch input:checked + span::after { transform: translateX(22px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app">
  <header class="hero">
    <svg class="die" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="4" y="4" width="40" height="40" rx="11" fill="currentColor"/>
      <g fill="#0f0d24"><circle cx="15" cy="15" r="3.4"/><circle cx="33" cy="15" r="3.4"/><circle cx="24" cy="24" r="3.4"/><circle cx="15" cy="33" r="3.4"/><circle cx="33" cy="33" r="3.4"/></g>
    </svg>
    <div>
      <h1>Random numbers</h1>
      <span class="sub">Pick a range, tap, done</span>
    </div>
  </header>

  <section class="result" aria-live="polite" id="result">
    <div class="hint">Tap Generate</div>
  </section>

  <div class="actions">
    <button id="gen" type="button">Generate</button>
    <button id="copy" type="button" hidden>Copy</button>
  </div>

  <section class="settings">
    <div class="row">
      <label for="min">Minimum</label>
      <input id="min" type="number" step="1" enterkeyhint="go">
    </div>
    <div class="row">
      <label for="max">Maximum</label>
      <input id="max" type="number" step="1" enterkeyhint="go">
    </div>
    <div class="row">
      <label for="count">How many<small>1 to 1000 at a time</small></label>
      <input id="count" type="number" step="1" min="1" max="1000" enterkeyhint="go">
    </div>
    <label class="row" for="repeat">
      <span class="lbl">Allow repeats<small>Same number can appear more than once</small></span>
      <span class="switch"><input id="repeat" type="checkbox" role="switch"><span></span></span>
    </label>
  </section>
</div>
</template>

<nav class="tabs" aria-label="Apps">
  <button class="tab" id="tab-random" type="button" aria-pressed="false">Random</button>
  <button class="tab" id="tab-todo" type="button" aria-pressed="false">To do</button>
</nav>

<script>
const API = "/api/todos";
const KEY = "todo-app-v1";              // this device's cached copy
const PENDING_KEY = "todo-app-pending"; // set while a change has not reached the server
const PICK_KEY = "todo-app-pick-count"; // the "Pick random" number, remembered on this device
const $ = (s) => document.querySelector(s);

let tasks = [];
let picked = new Set();
let editingId = null;
let writeChain = Promise.resolve();
let loaded = false; // true once the server copy has been checked

// Undo/redo keeps snapshots of the open and done lists. Pick count is not included.
const HISTORY_LIMIT = 100;
let undoStack = [];
let redoStack = [];

function checkpoint() {
  undoStack.push(JSON.stringify(tasks));
  if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack = [];
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(tasks));
  tasks = JSON.parse(undoStack.pop());
  afterHistoryChange();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(tasks));
  tasks = JSON.parse(redoStack.pop());
  afterHistoryChange();
}
function afterHistoryChange() {
  editingId = null;
  picked = new Set([...picked].filter((id) => tasks.some((t) => t.id === id && !t.done)));
  save();
  render();
}

function loadLocal() {
  try {
    const v = JSON.parse(localStorage.getItem(KEY));
    return Array.isArray(v) ? v : [];
  } catch (e) {
    return [];
  }
}
function setSync(text) {
  $("#sync").textContent = text;
}

async function remoteLoad() {
  const res = await fetch(API);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json(); // { tasks, pickCount }
}
function currentPickCount() {
  const n = parseInt($("#pick-count").value, 10);
  return Number.isInteger(n) && n >= 1 ? Math.min(n, 999) : 1;
}

async function remoteSave(json) {
  const res = await fetch(API, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: `{"tasks":${json},"pickCount":${currentPickCount()}}`,
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(tasks));
    localStorage.setItem(PENDING_KEY, "1");
  } catch (e) {
    console.warn("Could not cache to-dos:", e);
  }
  setSync("Saving…");
  // One save at a time; each sends the latest list.
  writeChain = writeChain.then(async () => {
    const snapshot = JSON.stringify(tasks);
    await remoteSave(snapshot);
    if (JSON.stringify(tasks) === snapshot) {
      try { localStorage.removeItem(PENDING_KEY); } catch (e) {}
    }
    setSync("Saved");
  }).catch((e) => {
    console.warn(e);
    setSync("Not saved to server yet. It will retry on your next visit.");
  });
}

async function init() {
  tasks = loadLocal();
  render();
  try {
    const remote = await remoteLoad();
    let pending = false;
    try { pending = !!localStorage.getItem(PENDING_KEY); } catch (e) {}
    if (pending || (!remote.tasks.length && tasks.length)) {
      // This device has changes the server has not seen yet: send them up.
      await remoteSave(JSON.stringify(tasks));
      try { localStorage.removeItem(PENDING_KEY); } catch (e) {}
    } else {
      tasks = remote.tasks;
      try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
    }
    if (typeof remote.pickCount === "number") {
      $("#pick-count").value = remote.pickCount;
      try { localStorage.setItem(PICK_KEY, String(remote.pickCount)); } catch (e) {}
    }
    setSync("Saved");
  } catch (e) {
    setSync("Server unreachable. Showing this device's copy.");
  }
  loaded = true;
  render();
}

function add(text) {
  text = text.trim();
  if (!text) return;
  checkpoint();
  tasks.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), text, done: false, doneAt: null, priority: false });
  save();
  render();
}
function find(id) {
  return tasks.find((t) => t.id === id);
}
function toggle(id) {
  const t = find(id);
  if (!t) return;
  checkpoint();
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;
  if (t.done) picked.delete(id);
  save();
  render();
}
function rename(id, text) {
  const t = find(id);
  text = text.trim();
  if (t && text && text !== t.text) {
    checkpoint();
    t.text = text;
    save();
  }
  render();
}
function remove(id) {
  checkpoint();
  tasks = tasks.filter((t) => t.id !== id);
  picked.delete(id);
  save();
  render();
}

function pickRandom() {
  const n = Math.max(1, parseInt($("#pick-count").value, 10) || 1);
  const arr = tasks.filter((t) => !t.done);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  picked = new Set(arr.slice(0, n).map((t) => t.id));
  render();
  const k = picked.size;
  $("#status").textContent = k === 0
    ? "No open to-dos to pick from."
    : k < n
      ? `Only ${k} open to-do${k === 1 ? "" : "s"} to pick from.`
      : `Picked ${k} at random.`;
}
function clearPick() {
  picked.clear();
  $("#status").textContent = "";
  render();
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v === true) node.setAttribute(k, "");
    else if (v !== false && v != null) node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

// Open items: priority first, then manual order. The saved list keeps this order.
function visiblePending() {
  return tasks
    .filter((t) => !t.done)
    .sort((a, b) => (b.priority ? 1 : 0) - (a.priority ? 1 : 0));
}

// Write the open items back into the saved list, in the given order.
// Done items keep their places.
function writePendingOrder(list) {
  const slots = [];
  tasks.forEach((t, i) => { if (!t.done) slots.push(i); });
  slots.forEach((slot, k) => { tasks[slot] = list[k]; });
}

// Drag and drop. Works with mouse and touch. The row follows the finger, a line
// shows where it will land, and the new order is saved on release. Drags stay
// inside the same priority group.
let drag = null;

function handle(t) {
  return el("span", {
    class: "handle", title: "Drag to reorder", "aria-label": "Drag to reorder",
    onpointerdown: startDrag,
    onpointermove: moveDrag,
    onpointerup: (e) => endDrag(e, true),
    onpointercancel: (e) => endDrag(e, false),
  }, "⠿");
}

function startDrag(e) {
  const handleEl = e.currentTarget;
  const li = handleEl.closest("li");
  const id = li.dataset.id;
  const pending = visiblePending();
  const fromIndex = pending.findIndex((x) => x.id === id);
  if (fromIndex < 0) return;
  const me = pending[fromIndex];

  // Drags stay inside the same priority group.
  let lo = fromIndex;
  let hi = fromIndex;
  while (lo > 0 && !!pending[lo - 1].priority === !!me.priority) lo--;
  while (hi < pending.length - 1 && !!pending[hi + 1].priority === !!me.priority) hi++;

  const groupIds = new Set(pending.slice(lo, hi + 1).map((x) => x.id));
  const others = [...$("#list").querySelectorAll("li[data-id]")]
    .filter((r) => r.dataset.id !== id && groupIds.has(r.dataset.id));

  // Measure the layout before anything moves.
  const rect = li.getBoundingClientRect();
  const gap = parseFloat(getComputedStyle($("#list")).rowGap) || 10;
  drag = {
    id, li, pointerId: e.pointerId, startY: e.clientY,
    centerY: rect.top + rect.height / 2,
    step: rect.height + gap,          // distance one row moves when it shifts a slot
    lo, f: fromIndex - lo,            // f = where the dragged row starts inside the group
    others,
    mids: others.map((r) => { const b = r.getBoundingClientRect(); return b.top + b.height / 2; }),
    k: null,                          // where it will land inside the group
  };
  others.forEach((r) => r.classList.add("shift"));
  handleEl.setPointerCapture(e.pointerId);
  li.classList.add("dragging");
  e.preventDefault();
}

function moveDrag(e) {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const dy = e.clientY - drag.startY;
  drag.li.style.transform = `translateY(${dy}px)`;

  // Count the rows that the dragged row's centre has passed.
  const y = drag.centerY + dy;
  let k = 0;
  drag.mids.forEach((m) => { if (m < y) k++; });
  drag.k = k;

  // Other rows slide one slot to open a gap at the landing spot.
  drag.others.forEach((r, j) => {
    const newSlot = j < k ? j : j + 1;
    const oldSlot = j < drag.f ? j : j + 1;
    const shift = newSlot > oldSlot ? drag.step : newSlot < oldSlot ? -drag.step : 0;
    r.style.transform = shift ? `translateY(${shift}px)` : "";
  });
}

function endDrag(e, apply) {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const d = drag;
  drag = null;
  d.li.classList.remove("dragging");

  if (!apply || d.k === null || d.k === d.f) {
    resetDrag(d);
    return;
  }
  // Slide the dragged row into the gap, then save the new order.
  d.li.classList.add("shift");
  d.li.style.transform = `translateY(${(d.k - d.f) * d.step}px)`;
  setTimeout(() => commitDrag(d), 200);
}

function resetDrag(d) {
  d.li.style.transform = "";
  d.li.classList.remove("shift");
  d.others.forEach((r) => {
    r.style.transform = "";
    r.classList.remove("shift");
  });
}

function commitDrag(d) {
  const list = visiblePending();
  const item = list.find((x) => x.id === d.id);
  const rest = list.filter((x) => x.id !== d.id);
  checkpoint();
  rest.splice(d.lo + d.k, 0, item);
  writePendingOrder(rest);
  save();
  render();
}

function togglePriority(id) {
  const t = find(id);
  if (!t) return;
  checkpoint();
  t.priority = !t.priority;
  save();
  render();
}

function row(t) {
  const classes = ["item"];
  if (t.done) classes.push("done");
  if (!t.done && t.priority) classes.push("priority");
  if (picked.has(t.id)) classes.push("picked");

  const cb = el("input", { type: "checkbox", "aria-label": "Mark as done", onchange: () => toggle(t.id) });
  cb.checked = t.done;
  const parts = [];
  if (!t.done) parts.push(handle(t));
  parts.push(cb);

  if (!t.done) {
    parts.push(el("button", {
      class: "star", type: "button",
      "aria-pressed": t.priority ? "true" : "false",
      "aria-label": t.priority ? "Remove priority" : "Set as priority",
      title: t.priority ? "Remove priority" : "Set as priority",
      onclick: () => togglePriority(t.id),
    }, t.priority ? "★" : "☆"));
  }

  if (editingId === t.id) {
    let cancel = false;
    const input = el("input", {
      class: "edit", type: "text", value: t.text, maxlength: 500, "aria-label": "Edit to-do",
      onkeydown: (e) => {
        if (e.key === "Enter") e.target.blur();
        if (e.key === "Escape") { cancel = true; e.target.blur(); }
      },
      onblur: (e) => {
        if (editingId !== t.id) return;
        editingId = null;
        if (cancel) render();
        else rename(t.id, e.target.value);
      },
    });
    setTimeout(() => { input.focus(); input.select(); }, 0);
    parts.push(input);
  } else {
    parts.push(el("span", {
      class: "text", tabindex: 0, title: "Click to edit",
      onclick: () => { editingId = t.id; render(); },
      onkeydown: (e) => { if (e.key === "Enter") { editingId = t.id; render(); } },
    }, t.text));
  }

  parts.push(el("button", { class: "del", type: "button", "aria-label": "Delete to-do", onclick: () => remove(t.id) }, "×"));
  return el("li", { class: classes.join(" "), "data-id": t.id }, ...parts);
}

function render() {
  const pending = visiblePending();
  const done = tasks.filter((t) => t.done).sort((a, b) => b.doneAt - a.doneAt);

  const list = $("#list");
  list.replaceChildren();
  if (!pending.length) {
    list.append(el("li", { class: "empty" },
      tasks.length ? "All done. Add the next one above." : "Nothing here yet. Type a to-do above and press Enter."));
  }
  pending.forEach((t) => list.append(row(t)));

  const doneList = $("#done");
  doneList.replaceChildren();
  $("#done-head").hidden = done.length === 0;
  $("#done-title").textContent = `Done (${done.length})`;
  done.forEach((t) => doneList.append(row(t)));

  $("#count").textContent = `${pending.length} open, ${done.length} done`;
  $("#clear-pick").hidden = picked.size === 0;
  $("#undo").disabled = !undoStack.length;
  $("#redo").disabled = !redoStack.length;
}

$("#add-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = $("#new");
  add(input.value);
  input.value = "";
  input.focus();
});
$("#pick").addEventListener("click", pickRandom);
$("#undo").addEventListener("click", undo);
$("#redo").addEventListener("click", redo);
document.addEventListener("keydown", (e) => {
  if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
  if (e.target.matches && e.target.matches('input[type="text"], input[type="number"]')) return; // native text undo
  const k = e.key.toLowerCase();
  if (k === "z") { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  else if (k === "y") { e.preventDefault(); redo(); }
});
$("#clear-pick").addEventListener("click", clearPick);

try {
  const saved = localStorage.getItem(PICK_KEY);
  if (saved) $("#pick-count").value = saved;
} catch (e) {}
$("#pick-count").addEventListener("input", (e) => {
  try { localStorage.setItem(PICK_KEY, e.target.value); } catch (err) {}
});
$("#pick-count").addEventListener("change", () => {
  if (loaded) save();
});

// iPhone Safari pinch-zoom gestures
["gesturestart", "gesturechange", "gestureend"].forEach((type) =>
  document.addEventListener(type, (e) => e.preventDefault(), { passive: false }));

function showView(name) {
  const random = name === "random";
  document.getElementById("view-random").hidden = !random;
  document.getElementById("view-todo").hidden = random;
  document.getElementById("tab-random").setAttribute("aria-pressed", String(random));
  document.getElementById("tab-todo").setAttribute("aria-pressed", String(!random));
}
document.getElementById("tab-random").addEventListener("click", () => showView("random"));
document.getElementById("tab-todo").addEventListener("click", () => showView("todo"));

/* ---------- Random Numbers (logic unchanged from the original app) ---------- */
function initRandom(root) {
  var KEY = "randomNumbers.settings.v1";
  var DEFAULTS = { min: "1", max: "100", count: "1", repeat: true };
  var MAX_ABS = 1e15, MAX_COUNT = 1000;

  function byId(id) { return root.getElementById(id); }
  var minEl = byId("min"), maxEl = byId("max"), countEl = byId("count"), repeatEl = byId("repeat");
  var resultEl = byId("result"), copyBtn = byId("copy"), genBtn = byId("gen");
  var dieEl = root.querySelector(".die");
  var lastText = "", runId = 0;

  function load() {
    var s = {};
    try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { s = {}; }
    return {
      min: typeof s.min === "string" ? s.min : DEFAULTS.min,
      max: typeof s.max === "string" ? s.max : DEFAULTS.max,
      count: typeof s.count === "string" ? s.count : DEFAULTS.count,
      repeat: typeof s.repeat === "boolean" ? s.repeat : DEFAULTS.repeat
    };
  }
  function save() {
    var s = { min: minEl.value, max: maxEl.value, count: countEl.value, repeat: repeatEl.checked };
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }
  var saved = load();
  minEl.value = saved.min; maxEl.value = saved.max; countEl.value = saved.count; repeatEl.checked = saved.repeat;
  ["input", "change"].forEach(function (ev) {
    [minEl, maxEl, countEl, repeatEl].forEach(function (el) { el.addEventListener(ev, save); });
  });
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", function () { if (document.hidden) save(); });

  function u32() { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; }
  function randInt(min, max) {
    var range = max - min + 1, x;
    if (range <= 4294967296) {
      var limit = Math.floor(4294967296 / range) * range;
      do { x = u32(); } while (x >= limit);
      return min + (x % range);
    }
    var r = BigInt(range), lim = (BigInt("18446744073709551616") / r) * r, b;
    do { b = (BigInt(u32()) << BigInt(32)) | BigInt(u32()); } while (b >= lim);
    return min + Number(b % r);
  }
  function generate(min, max, count, repeat) {
    var out = [], i;
    if (repeat) {
      for (i = 0; i < count; i++) out.push(randInt(min, max));
      return out;
    }
    var range = max - min + 1;
    if (range <= 200000) {
      var pool = new Array(range);
      for (i = 0; i < range; i++) pool[i] = min + i;
      for (i = 0; i < count; i++) {           /* partial Fisher-Yates */
        var j = i + randInt(0, range - i - 1);
        var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
        out.push(pool[i]);
      }
      return out;
    }
    var seen = new Set();
    while (out.length < count) {
      var n = randInt(min, max);
      if (!seen.has(n)) { seen.add(n); out.push(n); }
    }
    return out;
  }

  function showError(msg) {
    resultEl.innerHTML = "";
    var d = document.createElement("div"); d.className = "error"; d.textContent = msg;
    resultEl.appendChild(d);
    copyBtn.hidden = true; lastText = "";
  }
  function parseInt10(v) {
    if (v === null || String(v).trim() === "") return NaN;
    var n = Number(v);
    return Number.isInteger(n) ? n : NaN;
  }
  function run() {
    var token = ++runId;
    var min = parseInt10(minEl.value), max = parseInt10(maxEl.value), count = parseInt10(countEl.value);
    if (isNaN(min) || isNaN(max)) return showError("Enter whole numbers for minimum and maximum.");
    if (Math.abs(min) > MAX_ABS || Math.abs(max) > MAX_ABS) return showError("Use numbers between -1,000,000,000,000,000 and 1,000,000,000,000,000.");
    if (min > max) return showError("Minimum must be less than or equal to maximum.");
    if (isNaN(count) || count < 1 || count > MAX_COUNT) return showError("How many must be a whole number from 1 to " + MAX_COUNT + ".");
    var repeat = repeatEl.checked, range = max - min + 1;
    if (!repeat && count > range) return showError("Only " + range.toLocaleString() + " different numbers fit in that range. Lower How many or turn on Allow repeats.");

    var nums = generate(min, max, count, repeat);
    lastText = nums.join(", ");
    var die = dieEl;
    die.classList.remove("roll"); void die.getBoundingClientRect(); die.classList.add("roll");
    resultEl.classList.remove("flash"); void resultEl.offsetWidth; resultEl.classList.add("flash");
    var cls = nums.length === 1 ? "one" : nums.length <= 6 ? "few" : "many";
    resultEl.innerHTML = "";
    var box = document.createElement("div");
    box.className = "nums " + cls + " rolling";
    var spans = [];
    nums.forEach(function (n, i) {
      var sp = document.createElement("span");
      sp.textContent = String(n);
      sp.style.setProperty("--i", Math.min(i, 20));
      box.appendChild(sp); spans.push(sp);
    });
    resultEl.appendChild(box);
    copyBtn.hidden = false; copyBtn.textContent = "Copy";
    function settle() {
      for (var q = 0; q < spans.length; q++) spans[q].textContent = String(nums[q]);
      box.className = "nums " + cls + " final";
    }
    function scramble() {
      for (var k = 0; k < spans.length; k++) spans[k].textContent = String(randInt(min, max));
    }
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { settle(); return; }
    scramble();
    var ticks = 0, timer = setInterval(function () {
      if (token !== runId) { clearInterval(timer); return; }
      if (++ticks >= 5) { clearInterval(timer); settle(); return; }
      scramble();
    }, 40);
  }

  genBtn.addEventListener("click", function () {
    try { if (root.activeElement && root.activeElement.blur) root.activeElement.blur(); } catch (e) {}
    run();
  });
  /* Enter key generates (buttons keep their normal Enter behavior) */
  root.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.isComposing) return;
    var t = e.target;
    if (t && t.tagName === "BUTTON") return;
    e.preventDefault();
    try { if (root.activeElement && root.activeElement.blur) root.activeElement.blur(); } catch (err) {}
    save();
    run();
  });

  copyBtn.addEventListener("click", function () {
    if (!lastText) return;
    function done() { copyBtn.textContent = "Copied"; setTimeout(function () { copyBtn.textContent = "Copy"; }, 1200); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastText).then(done, function () {});
    } else {
      var ta = document.createElement("textarea"); ta.value = lastText; document.body.appendChild(ta);
      ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} document.body.removeChild(ta);
    }
  });
}

function mountRandom() {
  var host = document.getElementById("random-host");
  var root = host.attachShadow({ mode: "open" });
  root.appendChild(document.getElementById("random-template").content.cloneNode(true));
  initRandom(root);
}
mountRandom();

showView("random");
init();
</script>
